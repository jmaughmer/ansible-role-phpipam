---
# Everything here logs in as the phpIPAM user: over the socket for a local
# database, or over TLS for a remote one. The exceptions log in as root over
# the socket (unix_socket): the temporary grant for schema changes and the
# backup account, both on a local database the MariaDB role manages.
- name: Manage the phpIPAM database
  module_defaults:
    ansible.mysql.mysql_db: &phpipam_db_login
      login_user: "{{ phpipam_db_user }}"
      login_password: "{{ phpipam_db_password }}"
      login_unix_socket: "{{ phpipam_db_socket if __phpipam_db_local | bool else omit }}"
      login_host: "{{ omit if __phpipam_db_local | bool else phpipam_db_host }}"
      login_port: "{{ omit if __phpipam_db_local | bool else phpipam_db_port }}"
      ca_cert: "{{ phpipam_db_tls_ca if phpipam_db_tls | bool else omit }}"
      client_cert: "{{ phpipam_db_tls_cert if phpipam_db_tls | bool and phpipam_db_tls_cert | length > 0 else omit }}"
      client_key: "{{ phpipam_db_tls_key if phpipam_db_tls | bool and phpipam_db_tls_key | length > 0 else omit }}"
      check_hostname: "{{ phpipam_db_tls_verify | bool if phpipam_db_tls | bool else omit }}"
    ansible.mysql.mysql_query:
      <<: *phpipam_db_login
      login_db: "{{ phpipam_db_name }}"
  vars:
    # The day-to-day account lacks DDL rights only on a database the role manages.
    __phpipam_db_elevate: >-
      {{ __phpipam_db_local | bool and phpipam_manage_mariadb | bool
         and phpipam_db_privileges | upper != 'ALL' }}
    __phpipam_root_login: &phpipam_root_login
      login_user: root
      login_password: ""
      login_unix_socket: "{{ phpipam_db_socket }}"
      login_db: mysql
  block:
    - name: Look for the phpIPAM schema
      ansible.mysql.mysql_query:
        query: SHOW TABLES LIKE 'settings'
      register: __phpipam_schema
      changed_when: false
      check_mode: false

    - name: Read the database version
      ansible.builtin.command:
        argv: [php, "{{ __phpipam_helper }}", "{{ __phpipam_release_dir }}", status]
      register: __phpipam_db_status
      changed_when: false
      check_mode: false
      when: __phpipam_schema.query_result[0] | length > 0

    - name: Work out whether the schema changes
      ansible.builtin.set_fact:
        __phpipam_schema_missing: "{{ __phpipam_schema.query_result[0] | length == 0 }}"
        __phpipam_schema_outdated: >-
          {{ __phpipam_schema.query_result[0] | length > 0
             and not (__phpipam_db_status.stdout | from_json).current }}

    - name: Change the schema with full rights on the phpIPAM database
      when: __phpipam_schema_missing | bool or __phpipam_schema_outdated | bool
      block:
        - name: Grant full rights for the schema change
          ansible.mysql.mysql_query:
            <<: *phpipam_root_login
            query: "GRANT ALL PRIVILEGES ON `{{ phpipam_db_name }}`.* TO %s@'localhost'"
            positional_args: ["{{ phpipam_db_user }}"]
          when: __phpipam_db_elevate | bool

        - name: Import the phpIPAM schema
          ansible.mysql.mysql_db:
            name: "{{ phpipam_db_name }}"
            state: import
            target: "{{ __phpipam_release_dir }}/db/SCHEMA.sql"
          when: __phpipam_schema_missing | bool
          register: __phpipam_schema_import

        - name: Back up the database before the upgrade
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail;
              mysqldump --single-transaction --triggers --no-tablespaces {{ phpipam_db_name | quote }}
              | gzip {{ __phpipam_backup_encrypt_cmd }}
              > {{ (phpipam_backup_dir ~ '/pre-upgrade-' ~ (__phpipam_db_status.stdout | from_json).db ~ __phpipam_backup_ext) | quote }}
            executable: /bin/bash
          when:
            - __phpipam_schema_outdated | bool
            - phpipam_db_backup_before_upgrade | bool
            - __phpipam_db_local | bool
          changed_when: true

        - name: Upgrade the database
          ansible.builtin.command:
            argv: [php, "{{ __phpipam_helper }}", "{{ __phpipam_release_dir }}", upgrade]
          register: __phpipam_db_upgrade
          when: __phpipam_schema_outdated | bool
          changed_when: __phpipam_db_upgrade.stdout is search('^upgraded')

      always:
        - name: Return the phpIPAM user to its day-to-day rights
          ansible.mysql.mysql_query:
            <<: *phpipam_root_login
            query:
              - "REVOKE ALL PRIVILEGES ON `{{ phpipam_db_name }}`.* FROM %s@'localhost'"
              - "GRANT {{ phpipam_db_privileges }} ON `{{ phpipam_db_name }}`.* TO %s@'localhost'"
            positional_args: ["{{ phpipam_db_user }}"]
          when: __phpipam_db_elevate | bool

    - name: Set the Admin password
      ansible.builtin.command:
        argv: [php, "{{ __phpipam_helper }}", "{{ __phpipam_release_dir }}", set-admin-password]
        stdin: "{{ phpipam_admin_password }}"
      register: __phpipam_admin_password
      when: __phpipam_schema_import is changed or phpipam_admin_password_enforce | bool
      changed_when: __phpipam_admin_password.stdout is search('changed')
      no_log: true

    # Values travel base64-encoded: ansible-core 2.16 turns a template result
    # that looks like a dict (the DHCP setting's JSON) back into a dict.
    - name: Apply phpIPAM settings
      ansible.mysql.mysql_query:
        query: "UPDATE `settings` SET `{{ item.key }}` = FROM_BASE64(%s) WHERE `id` = 1"
        positional_args:
          - >-
            {{ ((item.value | int | string) if item.value is boolean
                else item.value if item.value is string
                else (item.value | to_json)) | b64encode }}
      loop: "{{ __phpipam_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: __phpipam_settings_result
      changed_when: __phpipam_settings_result.rowcount | sum > 0

    - name: Manage API applications
      ansible.mysql.mysql_query:
        query: >-
          INSERT INTO `api` (`app_id`, `app_code`, `app_permissions`, `app_security`, `app_comment`, `app_lock_type`)
          VALUES (%s, %s, %s, %s, %s, %s)
          ON DUPLICATE KEY UPDATE `app_code` = VALUES(`app_code`), `app_permissions` = VALUES(`app_permissions`),
          `app_security` = VALUES(`app_security`), `app_comment` = VALUES(`app_comment`), `app_lock_type` = VALUES(`app_lock_type`)
        positional_args:
          - "{{ item.app_id }}"
          - "{{ item.app_code | default('') }}"
          - "{{ item.permissions | default(1) | int }}"
          - "{{ item.security | default('ssl_token') }}"
          - "{{ item.comment | default('Managed by Ansible') }}"
          - "{{ item.lock_type | default('Auto') }}"
      loop: "{{ __phpipam_api_apps }}"
      loop_control:
        label: "{{ item.app_id }}"
      register: __phpipam_api_result
      changed_when: __phpipam_api_result.rowcount | sum > 0
      no_log: true

# The backup user logs in over the socket as itself (unix_socket), with
# read-only rights: no password to store, and nothing it can change.
- name: Set up the backup database account
  when: phpipam_backup_enabled | bool and __phpipam_db_local | bool
  module_defaults:
    ansible.mysql.mysql_query:
      login_user: root
      login_password: ""
      login_unix_socket: "{{ phpipam_db_socket }}"
      login_db: mysql
  block:
    - name: Look for the backup account
      ansible.mysql.mysql_query:
        query: SELECT COUNT(*) AS n FROM mysql.user WHERE User = %s AND Host = 'localhost'
        positional_args: ["{{ phpipam_backup_user }}"]
      register: __phpipam_backup_account
      changed_when: false
      check_mode: false

    - name: Create the backup account
      ansible.mysql.mysql_query:
        query: CREATE USER %s@'localhost' IDENTIFIED VIA unix_socket
        positional_args: ["{{ phpipam_backup_user }}"]
      when: __phpipam_backup_account.query_result[0][0].n | int == 0

    # GRANT changes nothing when the rights are already there.
    - name: Grant the backup account read-only rights
      ansible.mysql.mysql_query:
        query: "GRANT SELECT, LOCK TABLES, SHOW VIEW, TRIGGER, EVENT ON `{{ phpipam_db_name }}`.* TO %s@'localhost'"
        positional_args: ["{{ phpipam_backup_user }}"]
      changed_when: false
