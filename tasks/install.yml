---
- name: Install PHP and helper packages
  ansible.builtin.dnf:
    name: "{{ phpipam_php_packages + __phpipam_tool_packages + phpipam_extra_packages }}"
    state: present
  vars:
    # mariadb is the client, used for the schema import and backups.
    __phpipam_tool_packages: >-
      {{ ['tar', 'gzip', 'iputils', 'mariadb', 'python3-PyMySQL']
         + (['python3-cryptography'] if phpipam_tls_source == 'selfsigned' else [])
         + (['openssl'] if phpipam_backup_encrypt_cert | length > 0 else [])
         + (['mod_http2'] if phpipam_http2 | bool else []) }}
  notify:
    - Restart phpIPAM php-fpm
    - Reload phpIPAM httpd

- name: Create phpIPAM directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ phpipam_releases_dir }}" }
    - { path: "{{ phpipam_config_dir }}", group: "{{ phpipam_group }}", mode: "0750" }
    # Traversable, not listable: PHP and httpd reach the logo directory, and
    # the backup user its backups, through it.
    - { path: "{{ phpipam_state_dir }}", mode: "0711" }
  loop_control:
    label: "{{ item.path }}"

- name: Create the backup user
  ansible.builtin.user:
    name: "{{ phpipam_backup_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ phpipam_backup_dir }}"
    create_home: false
    comment: phpIPAM database backups
  when: __phpipam_db_local | bool

- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ phpipam_backup_dir }}"
    state: directory
    owner: "{{ phpipam_backup_user if __phpipam_db_local | bool else 'root' }}"
    group: "{{ phpipam_backup_user if __phpipam_db_local | bool else 'root' }}"
    mode: "0700"

- name: Create the directory for the backup encryption certificate
  ansible.builtin.file:
    path: "{{ __phpipam_backup_cert | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: phpipam_backup_encrypt_cert | length > 0

- name: Install the backup encryption certificate
  ansible.builtin.copy:
    content: "{{ phpipam_backup_encrypt_cert }}"
    dest: "{{ __phpipam_backup_cert }}"
    owner: root
    group: root
    mode: "0644"
  when: phpipam_backup_encrypt_cert | length > 0

- name: Create the logo directory
  ansible.builtin.file:
    path: "{{ phpipam_logo_dir }}"
    state: directory
    owner: "{{ phpipam_user }}"
    group: "{{ phpipam_group }}"
    mode: "0750"

- name: Check for the release directory
  ansible.builtin.stat:
    path: "{{ __phpipam_release_dir }}/index.php"
  register: __phpipam_release_stat

- name: Fetch and unpack the release
  when: not __phpipam_release_stat.stat.exists
  block:
    - name: Create the release directory
      ansible.builtin.file:
        path: "{{ __phpipam_release_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the release
      ansible.builtin.get_url:
        url: "{{ phpipam_archive_url }}"
        dest: "{{ phpipam_state_dir }}/phpipam-{{ phpipam_version }}.tgz"
        checksum: "{{ phpipam_archive_checksum | default(omit, true) }}"
        owner: root
        group: root
        mode: "0640"
      when: phpipam_archive_src | length == 0

    - name: Copy the release from the controller
      ansible.builtin.copy:
        src: "{{ phpipam_archive_src }}"
        dest: "{{ phpipam_state_dir }}/phpipam-{{ phpipam_version }}.tgz"
        owner: root
        group: root
        mode: "0640"
      when: phpipam_archive_src | length > 0

    # get_url checks the download itself; a copied tarball is checked here.
    - name: Hash the copied release
      ansible.builtin.stat:
        path: "{{ phpipam_state_dir }}/phpipam-{{ phpipam_version }}.tgz"
        checksum_algorithm: "{{ phpipam_archive_checksum.split(':')[0] }}"
      register: __phpipam_archive_stat
      when: phpipam_archive_src | length > 0 and phpipam_archive_checksum | length > 0

    - name: Check the copied release
      ansible.builtin.assert:
        that: __phpipam_archive_stat.stat.checksum == phpipam_archive_checksum.split(':')[1]
        fail_msg: "{{ phpipam_archive_src }} does not match {{ phpipam_archive_checksum }}."
        quiet: true
      when: phpipam_archive_src | length > 0 and phpipam_archive_checksum | length > 0

    - name: Unpack the release
      ansible.builtin.unarchive:
        src: "{{ phpipam_state_dir }}/phpipam-{{ phpipam_version }}.tgz"
        dest: "{{ __phpipam_release_dir }}"
        remote_src: true
        extra_opts: [--strip-components=1, --no-same-owner]
        owner: root
        group: root

    - name: Check the release unpacked
      ansible.builtin.stat:
        path: "{{ __phpipam_release_dir }}/functions/version.php"
      register: __phpipam_version_file
      failed_when: not __phpipam_version_file.stat.exists

    - name: Remove the downloaded tarball
      ansible.builtin.file:
        path: "{{ phpipam_state_dir }}/phpipam-{{ phpipam_version }}.tgz"
        state: absent

  rescue:
    - name: Remove the incomplete release
      ansible.builtin.file:
        path: "{{ __phpipam_release_dir }}"
        state: absent

    - name: Stop after the failed install
      ansible.builtin.fail:
        msg: "Could not install phpIPAM {{ phpipam_version }} from {{ phpipam_archive_src or phpipam_archive_url }}."

# The tree stays root-owned and read-only for PHP, except the upload folders.
- name: Make the upload directories writable by PHP
  ansible.builtin.file:
    path: "{{ __phpipam_release_dir }}/{{ item }}"
    state: directory
    owner: "{{ phpipam_user }}"
    group: "{{ phpipam_group }}"
    mode: "0750"
  loop: "{{ __phpipam_writable_dirs }}"

# Logos live in phpipam_logo_dir, so a new release starts with them.
- name: Look at the release's logo folder
  ansible.builtin.stat:
    path: "{{ __phpipam_release_dir }}/{{ __phpipam_logo_link }}"
  register: __phpipam_logo_stat

- name: Move the release's logo folder to the logo directory
  when: __phpipam_logo_stat.stat.isdir | default(false) and not __phpipam_logo_stat.stat.islnk | default(false)
  block:
    - name: Copy shipped logo files that the logo directory lacks
      ansible.builtin.copy:
        src: "{{ __phpipam_release_dir }}/{{ __phpipam_logo_link }}/"
        dest: "{{ phpipam_logo_dir }}/"
        remote_src: true
        force: false
        owner: "{{ phpipam_user }}"
        group: "{{ phpipam_group }}"
        mode: "0640"
        directory_mode: "0750"

    - name: Remove the release's logo folder
      ansible.builtin.file:
        path: "{{ __phpipam_release_dir }}/{{ __phpipam_logo_link }}"
        state: absent

- name: Link the release's logo folder to the logo directory
  ansible.builtin.file:
    src: "{{ phpipam_logo_dir }}"
    dest: "{{ __phpipam_release_dir }}/{{ __phpipam_logo_link }}"
    state: link

- name: Install the phpIPAM helper for Ansible
  ansible.builtin.copy:
    src: phpipam-ansible.php
    dest: "{{ __phpipam_helper }}"
    owner: root
    group: root
    mode: "0700"
