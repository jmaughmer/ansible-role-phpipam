---
# phpIPAM's Kea adapter reads subnet4/subnet6 from a local Kea-style file and
# connects to the lease and hosts databases named in it.
- name: Fetch the running configuration from the Kea Control Agent
  ansible.builtin.uri:
    url: "{{ phpipam_kea_ctrl_agent_url }}"
    method: POST
    url_username: "{{ phpipam_kea_ctrl_agent_user | default(omit, true) }}"
    url_password: "{{ phpipam_kea_ctrl_agent_password | default(omit, true) }}"
    force_basic_auth: "{{ phpipam_kea_ctrl_agent_user | length > 0 }}"
    validate_certs: "{{ phpipam_kea_ctrl_agent_validate_certs | bool }}"
    ca_path: "{{ phpipam_kea_ctrl_agent_ca_path | default(omit, true) }}"
    body_format: json
    body:
      command: config-get
      service: "{{ phpipam_kea_services }}"
  register: __phpipam_kea_config_get
  when: phpipam_kea_config_source == 'api'
  check_mode: false
  no_log: true

- name: Check the Kea answers
  ansible.builtin.assert:
    that: __phpipam_kea_config_get.json | map(attribute='result') | reject('equalto', 0) | list | length == 0
    fail_msg: >-
      config-get failed: {{ __phpipam_kea_config_get.json | map(attribute='text', default='') | join('; ') }}
    quiet: true
  when: phpipam_kea_config_source == 'api'

- name: Write the Kea configuration for phpIPAM
  ansible.builtin.template:
    src: kea.conf.j2
    dest: "{{ phpipam_kea_config_file }}"
    owner: root
    group: "{{ phpipam_group }}"
    mode: "0640"
  vars:
    __phpipam_kea_source: >-
      {{ (__phpipam_kea_config_get.json | map(attribute='arguments') | list | combine)
         if phpipam_kea_config_source == 'api' else phpipam_kea_config }}
  no_log: true
