---
# Collections and the dependent roles are installed by scripts/test.sh.
dependency:
  name: galaxy
  enabled: false
# Molecule would otherwise install requirements.yml's roles on its own and
# fail because scripts/test.sh already put them on ANSIBLE_ROLES_PATH.
prerun: false
driver:
  name: podman
# Names end in TEST_RUN_ID, which scripts/test.sh sets per checkout, so
# several checkouts can run the same scenario at once.
platforms:
  - name: phpipam-el9-${TEST_RUN_ID:-local}
    image: docker.io/almalinux/9-init
    pre_build_image: true
    command: /sbin/init
    systemd: always
    privileged: true
    rootless: true
  - name: phpipam-el10-${TEST_RUN_ID:-local}
    image: docker.io/almalinux/10-init
    pre_build_image: true
    command: /sbin/init
    systemd: always
    privileged: true
    rootless: true
provisioner:
  name: ansible
  env:
    # scripts/test.sh sets PHPIPAM_TEST_ROLES to where it installed the dependent roles.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:${PHPIPAM_TEST_ROLES}"
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
