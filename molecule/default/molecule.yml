---
# Collections and the dependent roles are installed by scripts/test.sh.
dependency:
  name: galaxy
  enabled: false
driver:
  name: podman
platforms:
  - name: phpipam-el9
    image: docker.io/almalinux/9-init
    pre_build_image: true
    command: /sbin/init
    systemd: always
    privileged: true
    rootless: true
  - name: phpipam-el10
    image: docker.io/almalinux/10-init
    pre_build_image: true
    command: /sbin/init
    systemd: always
    privileged: true
    rootless: true
provisioner:
  name: ansible
  env:
    # scripts/test.sh sets PHPIPAM_TEST_ROLES to where it installed the dependent roles.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:${PHPIPAM_TEST_ROLES}"
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
