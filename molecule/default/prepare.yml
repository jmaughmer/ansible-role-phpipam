---
- name: Prepare
  hosts: all
  tasks:
    # The almalinux init images have no iproute. Without it the first run has
    # no default_ipv4 fact, the role's packages then pull iproute in, and the
    # second run adds an IP SAN and reissues the self-signed certificate.
    - name: Install iproute so network facts are there from the first run
      ansible.builtin.dnf:
        name: iproute
        state: present

    - name: Install fapolicyd (left stopped) so the role writes its trust file, and openssl
      ansible.builtin.dnf:
        name: [fapolicyd, openssl]
        state: present

    # Backups are encrypted to this certificate; verify.yml decrypts one with the key.
    - name: Make a backup recipient key and certificate
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -newkey rsa:3072 -nodes -days 30 -subj /CN=phpipam-backup-test
          -keyout /root/backup-recipient.key -out /root/backup-recipient.crt
        creates: /root/backup-recipient.crt

    # /etc/hosts is a bind mount in podman, so it cannot be replaced atomically.
    - name: Resolve the test server name locally
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: 127.0.0.1 phpipam.example.test
        unsafe_writes: true
