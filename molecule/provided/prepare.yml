---
- name: Prepare
  hosts: all
  tasks:
    # The almalinux init images have no iproute. Without it the first run has
    # no default_ipv4 fact, and the role's packages then pull iproute in.
    - name: Install iproute, and openssl for the checks in verify.yml
      ansible.builtin.dnf:
        name: [iproute, openssl]
        state: present

    # /etc/hosts is a bind mount in podman, so it cannot be replaced atomically.
    - name: Resolve the test server name locally
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: 127.0.0.1 app.example.test
        unsafe_writes: true
