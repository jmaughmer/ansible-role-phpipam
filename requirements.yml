---
# Install with:
#   ansible-galaxy role install -r requirements.yml
#   ansible-galaxy collection install -r requirements.yml
roles:
  - name: jmaughmer.mariadb
    src: https://github.com/jmaughmer/ansible-role-mariadb.git
    scm: git
    version: main
  - name: jmaughmer.apache
    src: https://github.com/jmaughmer/ansible-role-apache.git
    scm: git
    version: main
collections:
  - name: ansible.posix
    version: ">=1.5.0"
  - name: community.general
    version: ">=8.0.0"
  # community.mysql's modules moved to ansible.mysql; this role uses
  # ansible.mysql, the MariaDB role still uses community.mysql.
  - name: ansible.mysql
    version: ">=4.2.1"
  - name: community.mysql
    version: ">=3.8.0"
  - name: community.crypto
    version: ">=2.15.0"
  - name: containers.podman
    version: ">=1.10.0"
